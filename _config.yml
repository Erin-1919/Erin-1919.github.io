title: "Mingke Erin Li"
author: "Mingke Erin Li"
description: "Bring Your Own Bottle & Do Your Own Research."
lang: "en"
baseurl: ""
url: "https://Erin-1919.github.io"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-email-protect
  - jekyll-redirect-from
  - jekyll-paginate

collections:
  - publications
  - news
  - showcase
  - posts

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "blog_post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - docs/
  - CLAUDE.md
  - UNLICENSE.txt
